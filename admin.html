<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Ration Shop Admin - Family & Card Portal</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0d47a1;
            --primary-light: #1976d2;
            --accent-green: #2e7d32;
            --accent-red: #c62828;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #cccccc;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-bar {
            background-color: var(--primary-blue);
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .app-bar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-container {
            flex: 1;
            padding: 20px;
            max-width: 580px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: var(--primary-blue);
            font-size: 1.3rem;
            text-align: center;
        }

        .badge-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
        }

        .badge-new { background-color: #e3f2fd; color: #0d47a1; }
        .badge-existing { background-color: #e8f5e9; color: #1b5e20; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-light);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .member-box {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .member-box h4 {
            color: var(--primary-light);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: var(--primary-light);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-logout {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .fp-wait-box {
            background-color: #fff3e0;
            border: 1px solid #ffe0b2;
            color: #e65100;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #ffe0b2;
            border-top: 3px solid #e65100;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-text { color: var(--accent-red); font-size: 0.85rem; text-align: center; display: none; }
        .success-text { color: var(--accent-green); font-size: 0.85rem; text-align: center; display: none; }
        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body>

    <header class="app-bar">
        <div class="app-bar-brand">
            <span class="material-icons">fingerprint</span>
            <h2>Hardware Admin Portal</h2>
        </div>
        <button id="logout-btn" class="btn-logout" style="display: none;">
            <span class="material-icons">logout</span> Logout
        </button>
    </header>

    <main class="main-container">
        <!-- LOGIN SECTION -->
        <div id="login-view" class="view-section active">
            <div class="card">
                <h2>Admin Login</h2>
                <p id="login-error" class="error-text">Incorrect User ID or Password</p>
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="login-userid" placeholder="Enter Admin User ID">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter Password">
                </div>
                <button id="login-btn" class="btn-primary">
                    <span class="material-icons">login</span> Login
                </button>
            </div>
        </div>

        <!-- ADD / EDIT CUSTOMER SECTION -->
        <div id="customer-view" class="view-section">
            <div class="card">
                <h2>Ration Card Registration</h2>
                <p id="customer-msg" class="success-text">Saved successfully!</p>
                <p id="customer-err" class="error-text">Operation failed.</p>

                <!-- CARD SELECTION / UID ENTRY -->
                <div class="form-group">
                    <label>Select or Enter Card UID (RC522)</label>
                    <input type="text" id="cust-uid" list="uid-suggestions" placeholder="Type or Select Card UID (e.g., D7C75C94)">
                    <datalist id="uid-suggestions">
                        <option value="D7C75C94"></option>
                        <option value="23F5AB0F"></option>
                    </datalist>
                </div>

                <div id="card-status-badge" style="display: none; align-self: flex-start;"></div>

                <div class="form-group">
                    <label>Ration Card No.</label>
                    <input type="text" id="cust-ration" placeholder="e.g. RC1001">
                </div>

                <!-- 2 MEMBERS DETAILS -->
                <div class="member-box">
                    <h4><span class="material-icons">person</span> Member 1 (Primary)</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="m1-name" placeholder="Member 1 Name">
                        </div>
                        <div class="form-group">
                            <label>Fingerprint ID</label>
                            <input type="number" id="m1-fpid" placeholder="1">
                        </div>
                    </div>
                </div>

                <div class="member-box">
                    <h4><span class="material-icons">person_outline</span> Member 2 (Secondary)</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="m2-name" placeholder="Member 2 Name">
                        </div>
                        <div class="form-group">
                            <label>Fingerprint ID</label>
                            <input type="number" id="m2-fpid" placeholder="2">
                        </div>
                    </div>
                </div>

                <!-- RATION ALLOCATIONS & PAYMENTS -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Rice (kg)</label>
                        <input type="number" id="cust-rice" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Wheat (kg)</label>
                        <input type="number" id="cust-wheat" placeholder="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Total Amount (₹)</label>
                        <input type="number" id="cust-amount" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>4-Digit UPI PIN</label>
                        <input type="password" id="cust-upi" maxlength="4" placeholder="1234">
                    </div>
                </div>

                <!-- ESP32 FINGERPRINT WAITING STATUS -->
                <div id="fp-wait-box" class="fp-wait-box">
                    <div class="spinner"></div>
                    <div>
                        <strong>Waiting for ESP32...</strong>
                        <p id="fp-status-msg" style="margin: 0; font-size: 0.8rem;">Please scan finger on hardware sensor.</p>
                    </div>
                </div>

                <button id="save-card-btn" class="btn-primary">
                    <span class="material-icons">save</span> Save & Wait for ESP32 Fingerprint
                </button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your Updated Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBRcy-3Rmatm8uN2eUfFUrKvPJ8nqbvWNs",
            authDomain: "automatic-ration-shop-a934b.firebaseapp.com",
            databaseURL: "https://automatic-ration-shop-a934b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "automatic-ration-shop-a934b",
            storageBucket: "automatic-ration-shop-a934b.firebasestorage.app",
            messagingSenderId: "603540489454",
            appId: "1:603540489454:web:c6336b05633c4a0fee1fff"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const loginView = document.getElementById("login-view");
        const customerView = document.getElementById("customer-view");
        const logoutBtn = document.getElementById("logout-btn");

        const loginError = document.getElementById("login-error");
        const customerMsg = document.getElementById("customer-msg");
        const customerErr = document.getElementById("customer-err");

        const cardUidInput = document.getElementById("cust-uid");
        const cardStatusBadge = document.getElementById("card-status-badge");
        const fpWaitBox = document.getElementById("fp-wait-box");
        const fpStatusMsg = document.getElementById("fp-status-msg");

        function setLoginState(isLoggedIn) {
            if (isLoggedIn) {
                loginView.classList.remove("active");
                customerView.classList.add("active");
                logoutBtn.style.display = "flex";
            } else {
                customerView.classList.remove("active");
                loginView.classList.add("active");
                logoutBtn.style.display = "none";
            }
        }

        // 1. Initial State Check
        async function checkInitialLoginStatus() {
            try {
                const snapshot = await get(ref(db, 'admin/login'));
                if (snapshot.exists() && snapshot.val() === true) {
                    setLoginState(true);
                } else {
                    setLoginState(false);
                }
            } catch (err) {
                setLoginState(false);
            }
        }
        checkInitialLoginStatus();

        // 2. Admin Login
        document.getElementById("login-btn").addEventListener("click", async () => {
            const usernameInput = document.getElementById("login-userid").value.trim();
            const passwordInput = document.getElementById("login-password").value.trim();

            loginError.style.display = "none";

            if (!usernameInput || !passwordInput) {
                loginError.innerText = "Please enter both User ID and Password.";
                loginError.style.display = "block";
                return;
            }

            try {
                const snap = await get(ref(db, 'admin/credentials'));
                let validUser = "admin";
                let validPass = "admin123";

                if (snap.exists()) {
                    const data = snap.val();
                    validUser = data.username || validUser;
                    validPass = data.password || validPass;
                } else {
                    await set(ref(db, 'admin/credentials'), { username: validUser, password: validPass });
                }

                if (usernameInput === validUser && passwordInput === validPass) {
                    await update(ref(db, 'admin'), { login: true });
                    setLoginState(true);
                } else {
                    loginError.innerText = "Wrong User ID or Password";
                    loginError.style.display = "block";
                }
            } catch (err) {
                loginError.innerText = "Database connection error.";
                loginError.style.display = "block";
            }
        });

        // 3. Admin Logout
        logoutBtn.addEventListener("click", async () => {
            try {
                await update(ref(db, 'admin'), { login: false });
            } catch (e) {}
            setLoginState(false);
        });

        // 4. Automatic Check: Is Card UID New or Existing?
        cardUidInput.addEventListener("input", async () => {
            const rawUid = cardUidInput.value.replace(/\s+/g, '').toUpperCase();
            if (rawUid.length < 4) {
                cardStatusBadge.style.display = "none";
                return;
            }

            const formattedKey = rawUid.startsWith("RFID_") ? rawUid : `RFID_${rawUid}`;

            try {
                const snapshot = await get(ref(db, `cards/${formattedKey}`));
                if (snapshot.exists()) {
                    // EXISTING CARD: Pre-fill form
                    const data = snapshot.val();
                    cardStatusBadge.className = "badge-status badge-existing";
                    cardStatusBadge.innerText = "Existing Card Found";
                    cardStatusBadge.style.display = "inline-block";

                    document.getElementById("cust-ration").value = data.rationCardNo || "";
                    document.getElementById("m1-name").value = data.member1?.name || "";
                    document.getElementById("m1-fpid").value = data.member1?.fingerprintId || 1;
                    document.getElementById("m2-name").value = data.member2?.name || "";
                    document.getElementById("m2-fpid").value = data.member2?.fingerprintId || 2;
                    document.getElementById("cust-rice").value = data.rice || 0;
                    document.getElementById("cust-wheat").value = data.wheat || 0;
                    document.getElementById("cust-amount").value = data.amount || 0;
                    document.getElementById("cust-upi").value = data.upi || 1234;
                } else {
                    // NEW CARD: Clear fields
                    cardStatusBadge.className = "badge-status badge-new";
                    cardStatusBadge.innerText = "New Card Detected";
                    cardStatusBadge.style.display = "inline-block";
                    resetFormFieldsExceptUid();
                }
            } catch (err) {
                console.error("Error checking card:", err);
            }
        });

        function resetFormFieldsExceptUid() {
            document.getElementById("cust-ration").value = "";
            document.getElementById("m1-name").value = "";
            document.getElementById("m1-fpid").value = "";
            document.getElementById("m2-name").value = "";
            document.getElementById("m2-fpid").value = "";
            document.getElementById("cust-rice").value = "";
            document.getElementById("cust-wheat").value = "";
            document.getElementById("cust-amount").value = "";
            document.getElementById("cust-upi").value = "";
        }

        // 5. Save Data & Synchronize with ESP32 Fingerprint Sensor
        document.getElementById("save-card-btn").addEventListener("click", async () => {
            customerMsg.style.display = "none";
            customerErr.style.display = "none";

            const rawUid = cardUidInput.value.replace(/\s+/g, '').toUpperCase();
            if (!rawUid) {
                customerErr.innerText = "Please enter or scan a Card UID.";
                customerErr.style.display = "block";
                return;
            }

            const cardKey = rawUid.startsWith("RFID_") ? rawUid : `RFID_${rawUid}`;
            const m1Name = document.getElementById("m1-name").value.trim();
            const m1FpId = parseInt(document.getElementById("m1-fpid").value) || 1;

            const m2Name = document.getElementById("m2-name").value.trim();
            const m2FpId = parseInt(document.getElementById("m2-fpid").value) || 2;

            const cardData = {
                rationCardNo: document.getElementById("cust-ration").value.trim() || "RC1001",
                member1: {
                    name: m1Name || "Member 1",
                    fingerprintId: m1FpId
                },
                member2: {
                    name: m2Name || "Member 2",
                    fingerprintId: m2FpId
                },
                rice: parseFloat(document.getElementById("cust-rice").value) || 0,
                wheat: parseFloat(document.getElementById("cust-wheat").value) || 0,
                amount: parseFloat(document.getElementById("cust-amount").value) || 0,
                upi: parseInt(document.getElementById("cust-upi").value) || 1234,
                paid: false,
                collected: false,
                collectedBy: "",
                collectionTime: ""
            };

            try {
                // Save Card details into Firebase
                await set(ref(db, `cards/${cardKey}`), cardData);
                await set(ref(db, 'system/activeCardId'), cardKey);

                // Send command to ESP32 to trigger Fingerprint Enrollment
                await set(ref(db, 'system/fpCommand'), {
                    action: "ENROLL",
                    targetFingerId: m1FpId,
                    cardId: cardKey
                });

                // Display waiting box
                fpWaitBox.style.display = "flex";
                fpStatusMsg.innerText = `Place finger for ${m1Name || 'Member 1'} (ID: ${m1FpId}) on ESP32 sensor...`;

                // Real-time listener for ESP32 registration feedback
                const fpStatusRef = ref(db, 'system/fpStatus');
                onValue(fpStatusRef, (snapshot) => {
                    const status = snapshot.val();
                    if (status && status.state === "SUCCESS") {
                        fpWaitBox.style.display = "none";
                        customerMsg.innerText = `Success! Card & Fingerprint enrolled for ${m1Name || 'Member'}!`;
                        customerMsg.style.display = "block";
                    } else if (status && status.state === "ERROR") {
                        fpStatusMsg.innerText = "Fingerprint enrollment failed on ESP32. Try again.";
                    }
                });

            } catch (err) {
                customerErr.innerText = "Failed to communicate with Firebase.";
                customerErr.style.display = "block";
            }
        });
    </script>
</body>
</html>
