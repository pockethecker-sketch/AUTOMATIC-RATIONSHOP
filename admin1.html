<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ration Shop Admin - Customer Entry</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0d47a1;
            --primary-light: #1976d2;
            --accent-green: #2e7d32;
            --accent-red: #c62828;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #cccccc;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-bar {
            background-color: var(--primary-blue);
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .app-bar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-container {
            flex: 1;
            padding: 20px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card h2 {
            color: var(--primary-blue);
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-group input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary-light);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-primary {
            background-color: var(--primary-light);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-logout {
            background-color: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .error-text {
            color: var(--accent-red);
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .success-text {
            color: var(--accent-green);
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <header class="app-bar">
        <div class="app-bar-brand">
            <span class="material-icons">admin_panel_settings</span>
            <h2>Admin Portal</h2>
        </div>
        <button id="logout-btn" class="btn-logout" style="display: none;">
            <span class="material-icons">logout</span> Logout
        </button>
    </header>

    <main class="main-container">
        <!-- LOGIN SECTION -->
        <div id="login-view" class="view-section active">
            <div class="card">
                <h2>Admin Login</h2>
                <p id="login-error" class="error-text">Incorrect User ID or Password</p>
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="login-userid" placeholder="Enter Admin User ID">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter Password">
                </div>
                <button id="login-btn" class="btn-primary">
                    <span class="material-icons">login</span> Login
                </button>
            </div>
        </div>

        <!-- ADD CUSTOMER SECTION -->
        <div id="customer-view" class="view-section">
            <div class="card">
                <h2>Add New Customer</h2>
                <p id="customer-msg" class="success-text">Customer added successfully!</p>
                <p id="customer-err" class="error-text">Failed to add customer.</p>

                <div class="form-group">
                    <label>Customer ID / Ration Card No.</label>
                    <input type="text" id="cust-id" placeholder="e.g. CUST1001">
                </div>

                <div class="form-group">
                    <label>Beneficiary Full Name</label>
                    <input type="text" id="cust-name" placeholder="Full Name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="cust-age" placeholder="e.g. 42">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="cust-phone" placeholder="10-digit number">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Rice Allocation (kg)</label>
                        <input type="number" id="cust-rice" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Wheat Allocation (kg)</label>
                        <input type="number" id="cust-wheat" placeholder="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Total Amount (₹)</label>
                        <input type="number" id="cust-amount" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>4-Digit UPI PIN</label>
                        <input type="password" id="cust-pin" maxlength="4" placeholder="e.g. 1234">
                    </div>
                </div>

                <button id="save-customer-btn" class="btn-primary">
                    <span class="material-icons">person_add</span> Add Customer to Firebase
                </button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Same Firebase Config as your existing system
        const firebaseConfig = {
              apiKey: "AIzaSyBRcy-3Rmatm8uN2eUfFUrKvPJ8nqbvWNs",
              authDomain: "automatic-ration-shop-a934b.firebaseapp.com",
              databaseURL: "https://automatic-ration-shop-a934b-default-rtdb.asia-southeast1.firebasedatabase.app",
              projectId: "automatic-ration-shop-a934b",
              storageBucket: "automatic-ration-shop-a934b.firebasestorage.app",
              messagingSenderId: "603540489454",
              appId: "1:603540489454:web:c6336b05633c4a0fee1fff"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const loginView = document.getElementById("login-view");
        const customerView = document.getElementById("customer-view");
        const logoutBtn = document.getElementById("logout-btn");

        const loginError = document.getElementById("login-error");
        const customerMsg = document.getElementById("customer-msg");
        const customerErr = document.getElementById("customer-err");

        // Helper to switch views
        function setLoginState(isLoggedIn) {
            if (isLoggedIn) {
                loginView.classList.remove("active");
                customerView.classList.add("active");
                logoutBtn.style.display = "flex";
            } else {
                customerView.classList.remove("active");
                loginView.classList.add("active");
                logoutBtn.style.display = "none";
            }
        }

        // 1. Initial State Check (if firebase login=true or session active)
        async function checkInitialLoginStatus() {
            try {
                const snapshot = await get(ref(db, 'admin/login'));
                if (snapshot.exists() && snapshot.val() === true) {
                    setLoginState(true);
                } else {
                    setLoginState(false);
                }
            } catch (err) {
                setLoginState(false);
            }
        }
        checkInitialLoginStatus();

        // 2. Handle Admin Login
        document.getElementById("login-btn").addEventListener("click", async () => {
            const usernameInput = document.getElementById("login-userid").value.trim();
            const passwordInput = document.getElementById("login-password").value.trim();

            loginError.style.display = "none";

            if (!usernameInput || !passwordInput) {
                loginError.innerText = "Please enter both User ID and Password.";
                loginError.style.display = "block";
                return;
            }

            try {
                // Get admin credentials from database path `admin/credentials`
                const snap = await get(ref(db, 'admin/credentials'));
                
                // Default credentials fallback if not set in DB yet
                let validUser = "admin";
                let validPass = "admin123";

                if (snap.exists()) {
                    const data = snap.val();
                    validUser = data.username || validUser;
                    validPass = data.password || validPass;
                } else {
                    // Seed initial credentials in DB if missing
                    await set(ref(db, 'admin/credentials'), { username: validUser, password: validPass });
                }

                if (usernameInput === validUser && passwordInput === validPass) {
                    // Login Success -> Set admin/login = true
                    await update(ref(db, 'admin'), { login: true });
                    setLoginState(true);
                } else {
                    // Login Failed -> Show Error
                    loginError.innerText = "Wrong User ID or Password";
                    loginError.style.display = "block";
                }
            } catch (err) {
                loginError.innerText = "Database connection error.";
                loginError.style.display = "block";
            }
        });

        // 3. Handle Admin Logout
        logoutBtn.addEventListener("click", async () => {
            try {
                // Set admin/login = false upon logout
                await update(ref(db, 'admin'), { login: false });
            } catch (e) {}
            setLoginState(false);
        });

        // 4. Handle Add Customer to Firebase
        document.getElementById("save-customer-btn").addEventListener("click", async () => {
            customerMsg.style.display = "none";
            customerErr.style.display = "none";

            const customerId = document.getElementById("cust-id").value.trim();
            const name = document.getElementById("cust-name").value.trim();
            const age = parseInt(document.getElementById("cust-age").value) || 0;
            const phone = document.getElementById("cust-phone").value.trim();
            const rice = parseFloat(document.getElementById("cust-rice").value) || 0;
            const wheat = parseFloat(document.getElementById("cust-wheat").value) || 0;
            const amount = parseFloat(document.getElementById("cust-amount").value) || 0;
            const pin = document.getElementById("cust-pin").value.trim() || "1234";

            if (!customerId || !name) {
                customerErr.innerText = "Customer ID and Name are required.";
                customerErr.style.display = "block";
                return;
            }

            try {
                // Create/Update customer data under `customers/{customerId}` bucket
                const customerData = {
                    customerId: customerId,
                    name: name,
                    age: age,
                    phone: phone,
                    rice: rice,
                    wheat: wheat,
                    amount: amount,
                    pin: pin,
                    paid: false
                };

                await set(ref(db, `customers/${customerId}`), customerData);

                // Set this newly added customer as current customer in system node
                await set(ref(db, 'system/currentCustomer'), customerId);

                customerMsg.innerText = `Customer '${name}' added successfully!`;
                customerMsg.style.display = "block";

                // Reset form fields
                document.getElementById("cust-id").value = "";
                document.getElementById("cust-name").value = "";
                document.getElementById("cust-age").value = "";
                document.getElementById("cust-phone").value = "";
                document.getElementById("cust-rice").value = "";
                document.getElementById("cust-wheat").value = "";
                document.getElementById("cust-amount").value = "";
                document.getElementById("cust-pin").value = "";
            } catch (err) {
                customerErr.innerText = "Failed to save data to Firebase.";
                customerErr.style.display = "block";
            }
        });
    </script>
</body>
</html>
